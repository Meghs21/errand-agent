# One-click deploy: Render dashboard → New → Blueprint → pick this repo.
# Fill in the keys when prompted. Without PayPal keys the demo runs with
# simulated PayPal; without an Anthropic or Groq key, payments fail closed to review.
services:
  - type: web
    name: agentpass
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      # After you link PayPal on the hosted site, copy the id from the logs here
      # so the demo wallet stays linked when the free server restarts.
      - key: PAYPAL_DEMO_VAULT_ID
        sync: false
