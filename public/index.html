<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Errand: an AI shopping agent on a PayPal leash</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5eff'/%3E%3Ctext x='16' y='22' font-size='18' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">E</span>
        <div>
          <h1>Errand</h1>
          <p>Hand off the shopping. Keep the purse strings.</p>
        </div>
      </div>
      <div class="pills" id="pills"></div>
    </header>

    <main class="layout">
      <section class="chat" aria-label="Chat with your agent">
        <div class="messages" id="messages">
          <div class="welcome" id="welcome">
            <h2>What do you need picked up?</h2>
            <p>Errand searches real stores, picks the best option and pays with your PayPal, but only inside the rules you set on the right.</p>
            <div class="suggestions" id="suggestions"></div>
          </div>
        </div>
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="e.g. Get my dad a birthday gift under $60, he loves fishing" autocomplete="off"></textarea>
          <button type="submit" id="send" aria-label="Send">Send</button>
        </form>
        <div class="composer-foot">
          <button class="link" id="new-errand" type="button">Start a new errand</button>
        </div>
      </section>

      <aside class="side">
        <section class="card" id="wallet-card">
          <h3>PayPal wallet</h3>
          <div id="wallet"></div>
        </section>

        <section class="card">
          <h3>Spending leash</h3>
          <div class="meter" id="meter">
            <div class="meter-bar"><span id="meter-fill"></span></div>
            <div class="meter-text" id="meter-text"></div>
          </div>
          <form id="rules" class="rules">
            <label>Monthly budget <span class="money"><b>$</b><input name="monthlyBudget" type="number" min="0" step="1" /></span></label>
            <label>Auto-approve up to <span class="money"><b>$</b><input name="autoApproveLimit" type="number" min="0" step="1" /></span></label>
            <label class="wide">Never buy (comma separated)<input name="blockedKeywords" type="text" /></label>
            <button type="submit" class="secondary">Save rules</button>
            <span class="saved" id="rules-saved" hidden>Saved</span>
          </form>
        </section>

        <section class="card">
          <h3>Activity</h3>
          <ul class="activity" id="activity"></ul>
        </section>
      </aside>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
